<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkas Scan Analyses - Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 id="form-title">Arkas Scan Analyses</h1>
      <p id="form-subtitle">Connectez-vous pour accéder à vos analyses SMC</p>

      <form class="login-form">
        <div class="form-group">
          <label for="email">Adresse Email</label>
          <input type="email" id="email" placeholder="votre@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Se connecter</button>
      </form>

      <div style="margin-top: 15px; text-align: center;">
        <p id="toggle-text" style="color: #a0aec0; font-size: 14px;">
          Pas encore de compte ? 
          <a href="#" id="toggle-mode" style="color: #00ff88; text-decoration: none; font-weight: bold;">S'inscrire</a>
        </p>
      </div>

      <p id="error-message" style="color: #ff4d4d; margin-top: 10px; font-size: 13px; text-align: center; display: none;"></p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
