<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARKAS SCAN AI — Connexion</title>

  <meta
    name="description"
    content="ARKAS SCAN AI - Scanner et analyser vos graphiques avec Price Action et Smart Money Concepts."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================================
       ARRIÈRE-PLAN
  ========================================================== -->
  <div class="bg-overlay"></div>


  <!-- =========================================================
       CONNEXION / INSCRIPTION
  ========================================================== -->
  <main class="login-container">

    <div class="login-card">

      <!-- Logo / titre -->
      <div class="login-brand">

        <div class="brand-icon">
          📊
        </div>

        <h1 id="form-title">
          ARKAS SCAN AI
        </h1>

        <div class="version-badge">
          V2
        </div>

      </div>


      <!-- Sous-titre -->
      <p id="form-subtitle" class="login-subtitle">
        Connectez-vous pour accéder à vos analyses SMC
      </p>


      <!-- =====================================================
           FORMULAIRE
      ====================================================== -->
      <form class="login-form" id="login-form">

        <!-- Email -->
        <div class="form-group">

          <label for="email">
            Adresse Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="votre@email.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- Mot de passe -->
        <div class="form-group">

          <label for="password">
            Mot de passe
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            minlength="6"
            required
          >

        </div>


        <!-- Bouton -->
        <button
          type="submit"
          id="submit-btn"
          class="btn-primary"
        >
          Se connecter
        </button>

      </form>


      <!-- =====================================================
           CHANGEMENT CONNEXION / INSCRIPTION
      ====================================================== -->
      <div class="toggle-container">

        <p id="toggle-text">

          Pas encore de compte ?

          <a
            href="#"
            id="toggle-mode"
          >
            S'inscrire
          </a>

        </p>

      </div>


      <!-- =====================================================
           MESSAGE D'ERREUR
      ====================================================== -->
      <div
        id="error-message"
        class="error-message"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- =====================================================
           INFORMATIONS
      ====================================================== -->
      <div class="login-footer">

        <span>
          🔒 Connexion sécurisée
        </span>

        <span>
          •
        </span>

        <span>
          SMC & Price Action
        </span>

      </div>

    </div>

  </main>


  <!-- =========================================================
       APPLICATION
  ========================================================== -->
  <script type="module" src="app.js"></script>

</body>
</html>
