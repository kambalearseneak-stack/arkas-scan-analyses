<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkas Scan Analyses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Voile sombre pour garantir la lisibilité -->
  <div class="bg-overlay"></div>
  
  <!-- Formulaire de connexion -->
  <main class="login-container">
    <h1>Arkas Scan Analyses</h1>
    <p>Connectez-vous pour accéder à vos analyses SMC</p>
    
    <form class="login-form">
      <div class="input-group">
        <label for="email">Adresse Email</label>
        <input type="email" id="email" required placeholder="votre@email.com">
      </div>
      
      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      
      <button type="submit" class="btn-primary">Se connecter</button>
    </form>
  </main>
</body>
</html>
